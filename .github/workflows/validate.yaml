# PR gate: lint always; plan (read-only dry-run against the live org) when an
# assumable identity is configured. Posts the plan as a PR comment so
# approvers see exactly what merging will change.
#
# Hardening: all actions are Chainguard Actions hardened mirrors (or
# SHA-pinned first-party), permissions are deny-by-default and granted
# per job, and untrusted checkout credentials are not persisted.
name: validate

on:
  pull_request:
    paths: ["config/**", "certs/**", "scripts/**", "bin/**"]

# Deny-by-default; each job requests only what it needs.
permissions: {}

# One validate run per PR; a new push supersedes the stale plan.
concurrency:
  group: validate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: chainguard-actions/actions-checkout@ec419da8013e66e059571719dbfa6d1483438668 # v7.0.1
        with:
          persist-credentials: false
      - uses: chainguard-actions/actions-setup-python@8d5905a217cbe3d8720cc9c84de004f936e8ed82 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: ./bin/cg-sync lint

  plan:
    # Set the CHAINGUARD_IDENTITY repo/org variable to the UIDP of an
    # assumable identity that trusts this repo's OIDC claims (viewer role
    # is enough for plan). See README "Identity setup".
    if: vars.CHAINGUARD_IDENTITY != ''
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # OIDC token for chainctl assumable identity
      pull-requests: write # plan comment
    steps:
      - uses: chainguard-actions/actions-checkout@ec419da8013e66e059571719dbfa6d1483438668 # v7.0.1
        with:
          persist-credentials: false
      - uses: chainguard-actions/actions-setup-python@8d5905a217cbe3d8720cc9c84de004f936e8ed82 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - uses: chainguard-dev/setup-chainctl@2cddd35a2f120d9973e58094dc6878c93cf58c28 # v0.5.1
        with:
          identity: ${{ vars.CHAINGUARD_IDENTITY }}
      - name: plan
        id: plan
        run: |
          set +e
          ./bin/cg-sync plan --output markdown | tee plan.md
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          # 0 = in sync, 2 = changes pending (expected on a PR), 1 = error
          [ "$rc" = "1" ] && exit 1 || exit 0
      - name: comment plan on PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR_NUMBER" --body-file plan.md --edit-last --create-if-none
      - uses: chainguard-actions/actions-upload-artifact@ef35e1b5b67dfd2cab54a24b06e94357a0e3acb3 # v7.0.1
        with:
          name: rendered-configs
          path: rendered/
          if-no-files-found: ignore
