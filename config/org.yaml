# Tier 0 — organization-wide settings for the governance tool itself.
# Changes here are high-blast-radius: gate behind CODEOWNERS review.

org: acme.example.com # CHANGE ME: your Chainguard organization (cgr.dev/<org>)

defaults:
  # Max concurrent chainctl invocations (chainctl itself caps batch at 10).
  concurrency: 8
  # Where rendered per-image Custom Assembly configs are written for review.
  render-dir: rendered

# Governance: every image enablement and every customization must cite a
# change ticket (SNOW / JIRA / GitHub issue). Lint fails without one.
ticket:
  required: true
  # Adjust to your tracker(s). Matched against the `ticket:` field.
  pattern: '^(JIRA-\d+|CHG\d{7}|SNOW-\d+|https://github\.com/[\w.-]+/[\w.-]+/issues/\d+)$'

# OCI annotations injected into every customized image for traceability.
# CHANGE ME: use your own reverse-DNS prefix (must NOT be `dev.chainguard`).
annotations:
  ticket-key: com.acme.governance/change-ticket
  managed-by-key: com.acme.governance/managed-by
  managed-by-value: chainctl-gitops
