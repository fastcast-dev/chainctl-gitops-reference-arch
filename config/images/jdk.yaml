# Tier 3 — per-image customization overlay (sweep/phase 3).
# One file per image, filename must match the image name.
# Merged ON TOP of config/global.yaml, then applied with
# `chainctl images repos build apply --repo=<image> --file=<rendered> --yes`.

image: jdk

# The approved use-case that justifies this customization.
ticket: JIRA-2201
approved-by: platform-security

customizations:
  # Extra packages from Chainguard's APK repository.
  # Use-case (JIRA-2201): Java services parse JSON in entrypoint scripts.
  packages:
    - jq

  environment:
    LANG: en_US.UTF-8

  annotations: {}

  # Optional: passthrough of Custom Assembly `accounts` (users/groups/run-as).
  # accounts:
  #   run-as: "65532"

  # Optional: publish as a NEW variant repo instead of mutating the base
  # image, e.g. keep `jdk` pristine and ship `jdk-tools` to the one team
  # with the approved use-case.
  # save-as: jdk-tools
